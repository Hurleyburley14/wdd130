<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
 <main class="post-card">
      <header class="post-header">
        <img
          class="profile-picture"
          src="images/pexels-edgarphotographyy-14097382.jpg"
          alt="Dead man"
        />

        <div class="author">Coolage_Boi</div>

        <time class="posted-time">55 mins</time>

        <button class="more-button" aria-label="More options">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <figure class="photo-frame">
        <img
          class="main-picture"
          src="images/ghost.jpg"
          alt="Ghost buddies"
        />
      </figure>

      <footer class="post-actions">
        <div class="left-actions">
          <button class="save-button" type="button" aria-label="Save post">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="24"
    height="24"
    aria-hidden="true"
  >
    <path
      d="M5 21V5Q5 4.17 5.59 3.59T7 3H17q.82 0 1.41.59T19 5V21l-7-3-7 3Zm2-3.05 5-2.15 5 2.15V5H7v12.95ZM7 5H17H12H7Z"
    />
  </svg>
</button>
<button class="share-button" type="button" aria-label="Share post">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="24"
    height="24"
    aria-hidden="true"
  >
    <path
      d="M6 22q-.82 0-1.41-.59T4 20V10q0-.83.59-1.41T6 8h3v2H6v10h12V10h-3V8h3q.82 0 1.41.59T20 10v10q0 .82-.59 1.41T18 22H6Zm5-6V4.82L9.4 6.43 8 5l4-4 4 4-1.4 1.43L13 4.82V16h-2Z"
    />
  </svg>
</button>
          
          <button class="comment-action" aria-label="15 comments">
            <span class="comment-icon"></span>
            <span>15</span>
          </button>
        </div>

        <button class="likes" aria-label="52 likes">
          <span>52</span>
          <span class="heart">♡</span>
        </button>
      </footer>
    </main>

    
</body>
</html>
